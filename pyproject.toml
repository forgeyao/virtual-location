[project]
name = "virtual-location"
version = "0.1.0"
description = "USB fixed-location simulation for iPhone"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.14,<3.15"
dependencies = ["pymobiledevice3==11.49.0"]

[dependency-groups]
dev = ["pytest==9.2.0"]

[project.scripts]
virtual-location = "virtual_location.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/virtual_location"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
